name: Metrics
on:
  schedule:
    - cron: "0 15 * * *"        # 00:00 KST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to the v3.34 commit (what @latest pointed to on 2026-10-15); bump deliberately after reviewing the release
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # METRICS_TOKEN: classic PAT with repo + read:org so private org repos are counted
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics-renders   # keeps daily bot commits off main
          filename: github-metrics.svg
          plugins_errors_fatal: yes
          debug: yes

          user: dev-minimalism
          template: classic
          base: header, activity
          config_timezone: Asia/Seoul
          config_display: regular

          # Count everything the user owns or contributes to across orgs; skip forks and non-code repos
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          # metrics fetches a single page (it stops when a page returns fewer than `repositories`) and does not
          # retry after a timeout. 100 repos exceeds GitHub's ~10s GraphQL timeout; 20 took 3.5s. Keep both equal.
          repositories: 40
          repositories_batch: 40
          repositories_skipped: >-
            dev-minimalism/dev-minimalism,
            dev-minimalism/dev-minimalism.github.io,
            pink-spider/.github,
            pink-spider/pink-spider.github.io,
            pink-spider/chainwell-privacy,
            pink-spider/firedom-privacy,
            pink-spider/nonogram-privacy,
            pink-spider/sudoku-privacy,
            pink-spider/timesheet-privacy,
            level-up-together/.github,
            level-up-together/docs,
            level-up-together/dev.pink-spider.io,
            pink-spider-atelier/.github,
            the-hitchhikers-guide-to-the-code/the-hitchhikers-guide-to-the-code.github.io

          # Languages from GitHub's per-repo stats (no indepth clone analysis: it timed out in Jan 2026 and produced "Other")
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_other: no
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, scss, shell, plpgsql, hcl, dockerfile, makefile, batchfile, powershell, jupyter notebook, tex, vim script
